[platformio]
default_envs = classic2usb
src_dir = firmware
lib_dir = firmware/src/RetroZord/PicoZordXinputDEV-main-20260418

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#79ce473e1a8010ed8096388690222fd2c94858a6
framework = arduino
board = rpipico
board_build.core = earlephilhower
# Keep all RP2040 builds on a 12 MHz CPU-clock multiple for TinyUSB + PIO-USB
# host timing. PS auth dongles and USB-host diagnostics are sensitive to this.
board_build.f_cpu = 240000000L
board_build.filesystem_size = 12k
board_build.arduino.earlephilhower.boot2_source = boot2_w25q080_2_padded_checksum.S
# The Arduino-Pico EEPROM region remains at the top of flash. The preceding
# 12KB is reserved for Reflex-managed auth keys, Bluetooth bonds, and 32
# learned HID mappings.
board_upload.maximum_size = 2084864
upload_protocol = picotool
extra_scripts =
  pre:tools/pio_hooks.py
  tools/pio_stage3_v2.py
build_src_filter =
  +<*>
  -<targets/>
  -<_worktrees/>
  -<firmware.cpp>
  -<src/input_usb/>
  -<src/JVS2USB/>
  -<src/RetroZord/>
  # Never enabled by any product; keep their 128 KB card cache and cross-
  # references out of the link rather than relying on --gc-sections.
  -<input/memcard/>
  -<input/gameport/>
  # Retro-ingress products only (re-included by env:classic2usb): the modules
  # use the Classic2USB HDMI pin map.
  -<input/intellivision/>
  -<input/colecovision/>
  -<input/cdi/>
  # Modern2USB only (re-included by env:modern2usb). Even compiled empty, one
  # more object reorders ld's RAM-to-flash veneers in every other image.
  -<platform/compact_stdio.cpp>
  -<features/jaguar_trace/>
build_flags =
  -DUSE_TINYUSB
  # Only Classic2USB exposes a USB drive (it unflags this); keep TinyUSB's MSC
  # class out of every other link.
  -DCFG_TUD_MSC=0
  -DLWIP_IPV6=0
  -DLWIP_IPV4=1
  -Ifirmware/input/usb_host/input_usb
  -Ifirmware/src
  -Ifirmware/src/SSD1306Ascii
  -Ifirmware/src/U8g2/src
  -Ifirmware/src/libxsm3
lib_ignore =
  RetroZordReborn

[env:classic2usb]
lib_ignore =
  ${env.lib_ignore}
  ArduinoOTA
  LittleFS
  PicoOTA
  Updater
  WiFi
build_src_filter =
  ${env.build_src_filter}
  +<input/intellivision/>
  +<input/colecovision/>
  +<input/cdi/>
  -<input/jvs/>
  -<input/pcfx/>
  -<src/JoybusLib/joybus_gba.cpp>
build_unflags =
  -Os
  # The opt-in USB drive (features/usb_drive) needs TinyUSB's MSC class.
  -DCFG_TUD_MSC=0
build_flags =
  ${env.build_flags}
  -O3
  -DJOYBUS_DISABLE_GBA_LINK
  -DENABLE_RUNTIME_SERIAL_DEBUG_CDC
  -DENABLE_EXPERIMENTAL_XINPUT2P_OUTPUT
  -DENABLE_XINPUT2P_WIRELESS_TRANSPORT
  -DENABLE_EXPERIMENTAL_CONSOLE_MOUSE
